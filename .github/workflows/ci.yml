name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5433/portfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: make lint
      - run: make prettier-check
      - run: make test

  cypress:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5433/portfolio_e2e
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      AUTH_CODE_SECRET: ci-only-auth-code-secret
      CAPTCHA_SECRET: ci-only-captcha-secret
      MAIL_CONSOLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma migrate deploy
      - run: bunx cypress install
      - run: bun run build
      - run: nohup bun run start > next.log 2>&1 &
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000 && exit 0
            sleep 1
          done
          cat next.log
          exit 1
      - uses: cypress-io/github-action@v6
        with:
          install: false
      - uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
      - if: failure()
        run: cat next.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
