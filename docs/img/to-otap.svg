<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="OTAP-straat van lokaal naar productie">
  <title>OTAP-straat van lokaal naar productie</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#333333" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="200" fill="#ffffff"/>
  <rect x="20.0" y="50.0" width="190.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="115.0" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Ontwikkel</text>
  <text x="115.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">lokaal</text>
  <text x="115.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">make dev, Postgres in Docker</text>
  <rect x="256.0" y="50.0" width="190.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="351.0" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Test</text>
  <text x="351.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">GitHub Actions</text>
  <text x="351.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">lint, Vitest, Cypress</text>
  <rect x="492.0" y="50.0" width="190.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="587.0" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Acceptatie</text>
  <text x="587.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">Railway staging</text>
  <text x="587.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">branch develop</text>
  <rect x="728.0" y="50.0" width="190.0" height="80.0" rx="4" fill="#f3f3f3" stroke="#333333" stroke-width="1.2"/>
  <text x="823.0" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Productie</text>
  <text x="823.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">Railway productie</text>
  <text x="823.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">branch main</text>
  <line x1="210.0" y1="90.0" x2="253.0" y2="90.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="200.4" y="29.0" width="65.2" height="16" fill="#ffffff"/>
  <text x="233.0" y="40.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">push en PR</text>
  <line x1="446.0" y1="90.0" x2="489.0" y2="90.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="413.5" y="29.0" width="111.0" height="16" fill="#ffffff"/>
  <text x="469.0" y="40.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">merge naar develop</text>
  <line x1="682.0" y1="90.0" x2="725.0" y2="90.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="643.8" y="29.0" width="122.4" height="16" fill="#ffffff"/>
  <text x="705.0" y="40.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="middle">release-PR naar main</text>
  <text x="20.0" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#5a5a5a" text-anchor="start">Elke omgeving heeft een eigen database en eigen geheimen. Railway draait vóór elke deploy de migraties.</text>
</svg>
